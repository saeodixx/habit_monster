name: habit_monster
description: "습관 몬스터 — 습관을 지키면 몬스터가 자라는 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  kakao_flutter_sdk_user: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/monsters/
    - assets/images/characters/
    - assets/images/items/
    - assets/images/backgrounds/
    - assets/images/brand/
    - assets/audio/bgm/

  fonts:
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
