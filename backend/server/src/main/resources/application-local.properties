# DB 없이 바로 띄워 보는 프로필: ./gradlew bootRun --args='--spring.profiles.active=local'
# 메모리 DB(H2)라 서버를 끄면 데이터가 사라진다. 테스트도 이 프로필을 쓴다.
spring.datasource.url=jdbc:h2:mem:habit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# 로컬 전용 키 — 운영에서는 반드시 JWT_SECRET 환경변수
app.auth.jwt-secret=local-dev-secret-change-me-0123456789abcdef

# 소셜 로그인 확인용 공개 값 (카카오 앱 ID, 구글 웹 · Android 클라이언트 ID)
app.auth.kakao.app-id=1600125
